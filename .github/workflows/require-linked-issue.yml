name: Require Linked Issue

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize, reopened, ready_for_review ]

permissions:
  pull-requests: read

jobs:
  require-linked-issue:
    name: Require linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for closing issue reference
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const pattern = /\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+\b/i;

            if (!pattern.test(body)) {
              core.setFailed(
                "PRs into main must link an issue with a closing keyword, for example: Fixes #123, Closes #123, or Resolves #123."
              );
            }
